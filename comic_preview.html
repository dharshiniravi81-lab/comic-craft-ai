<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - Comic Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-top: 0;
        }

        .panel img {
            display: block;
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            border-radius: 10px;
        }

        .scene {
            color: #555;
            font-style: italic;
        }

        .story {
            white-space: pre-wrap;
            line-height: 1.7;
        }

        .buttons {
            text-align: center;
            margin: 30px 0;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            margin: 5px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎨 Your Comic</h1>

    <p class="subtitle">
        Your AI-generated comic story
    </p>

    {% for panel in layout %}

    <div class="panel">

        <h2>
            Panel {{ panel.panel }}:
            {{ panel.title }}
        </h2>

        <img
            src="/{{ panel.image }}"
            alt="Comic Panel {{ panel.panel }}"
        >

        <p class="scene">
            {{ panel.scene_description }}
        </p>

        <div class="story">
            {{ panel.story }}
        </div>

    </div>

    {% endfor %}

    <div class="buttons">

        <a
            class="button"
            href="/{{ pdf_path }}"
            target="_blank"
        >
            📄 Open PDF
        </a>

        <a
            class="button"
            href="/"
        >
            ← Create Another Comic
        </a>

    </div>

</div>

</body>
</html>
