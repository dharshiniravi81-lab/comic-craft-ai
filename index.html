<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - AI Comic Story Creator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎨 ComicCraft</h1>

    <p class="subtitle">
        Create your own AI-powered comic story
    </p>

    <form action="/generate" method="post">

        <label for="prompt">Story Prompt</label>
        <textarea
            id="prompt"
            name="prompt"
            placeholder="Enter your story idea..."
            required
        ></textarea>

        <label for="character_name">Character Name</label>
        <input
            type="text"
            id="character_name"
            name="character_name"
            placeholder="Example: Arjun"
            required
        >

        <label for="setting">Setting</label>
        <input
            type="text"
            id="setting"
            name="setting"
            placeholder="Example: A futuristic city"
            required
        >

        <label for="tone">Tone</label>
        <select id="tone" name="tone">
            <option value="Adventure">Adventure</option>
            <option value="Comedy">Comedy</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Mystery">Mystery</option>
            <option value="Action">Action</option>
            <option value="Drama">Drama</option>
        </select>

        <label for="art_style">Art Style</label>
        <select id="art_style" name="art_style">
            <option value="Comic Book">Comic Book</option>
            <option value="Manga">Manga</option>
            <option value="Anime">Anime</option>
            <option value="Cartoon">Cartoon</option>
            <option value="Realistic">Realistic</option>
        </select>

        <button type="submit">
            🚀 Generate Comic
        </button>

    </form>

</div>

</body>
</html>
